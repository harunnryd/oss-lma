[package]
name = "lma-link"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
lma-capture = { path = "../lma-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.26"
urlencoding = "2"

[dev-dependencies]
jsonschema = "0.29"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lib]
path = "src/lib.rs"
