<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oss-lma</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>oss-lma</h1>
    <p>Private desktop meeting capture</p>
    <section aria-labelledby="onboarding-heading">
      <h2 id="onboarding-heading">Capture access</h2>
      <p id="permission-status" role="status">Checking microphone and screen recording access…</p>
      <div class="actions"><button id="permissions" class="secondary">Open microphone settings</button><button id="screen" class="secondary">Open screen recording settings</button></div>
    </section>
    <section id="provider-settings" aria-labelledby="provider-heading">
      <h2 id="provider-heading">Transcription provider</h2>
      <form id="provider-form">
        <label>Provider <select id="provider" name="provider"><option value="deepgram">Deepgram</option><option value="assemblyAi">AssemblyAI</option><option value="azure">Azure Speech</option></select></label>
        <label>Model <input id="model" name="model" required></label>
        <label>Language (optional) <input id="language" name="language"></label>
        <label id="azure-region-field">Azure region <input id="azure-region" name="azureRegion"></label>
        <label>API key <input id="provider-secret" name="secret" type="password" autocomplete="off" placeholder="Stored securely on this device"></label>
        <p id="secret-status">No API key stored</p>
        <label class="checkbox"><input id="diarize-mic" type="checkbox"> Separate microphone speaker labels</label>
        <button id="save-provider" type="submit">Save provider settings</button>
      </form>
    </section>
    <section aria-labelledby="meeting-heading">
      <div class="status"><h2 id="meeting-heading">Live meeting</h2><span id="phase" class="badge">loading</span></div>
      <div class="actions"><button id="start">Start meeting</button><button id="pause" class="secondary">Pause</button><button id="resume" class="secondary">Resume</button><button id="stop" class="secondary">Stop</button></div>
      <div id="message" role="status"></div>
      <ol id="transcript" aria-live="polite" aria-label="Live transcript"></ol>
    </section>
  </main>
</body>
</html>
